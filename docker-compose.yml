# Local one-command run of both services. Supabase is a managed/external service, so it is
# NOT a container here — point .env at your Supabase project.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    ports: ["8000:8000"]
    env_file: .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports: ["80:80"]
    depends_on: [api]
